<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Subtraction Helper</title>
<style>
:root{
  --bg:#141a22; --board:#1f2a33; --chalk:#f4f1e8; --dim:#8a97a3;
  --gold:#ffd23f; --good:#3ddc84; --bad:#ff4d5e; --blue:#4fc3ff;
  --colA:rgba(255,255,255,.035); --colB:rgba(255,255,255,.075);
  --c:clamp(40px,min(11vw,7.2vh),76px);
}
#play{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap;width:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;background:var(--bg);color:var(--chalk);
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;overflow-x:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:12px 16px 24px;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none}

/* top bar */
#top{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:center;gap:10px}
#coins{font-size:22px;font-weight:700;color:var(--gold);background:#0c1117;padding:6px 14px;border-radius:999px;border:2px solid #3a3113}
#coins.spend{animation:spend .5s}
@keyframes spend{30%{transform:scale(1.18);color:var(--bad)}}
#title{font-size:18px;color:var(--dim);font-weight:700;letter-spacing:.5px}

/* start screen */
#start{max-width:620px;width:100%;margin-top:18px;text-align:center}
.monster{font-size:84px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.ask{font-size:clamp(30px,7vw,46px);font-weight:800;margin:6px 0 14px}
.bigbtn{background:var(--blue);color:#06121b;font-size:22px;font-weight:800;padding:14px 26px;border-radius:14px;margin:6px;box-shadow:0 5px 0 #1d6f99}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d6f99}
.bigbtn.gold{background:var(--gold);box-shadow:0 5px 0 #a3830f}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.pick button{background:#2b3843;color:var(--chalk);font-size:17px;font-weight:700;padding:9px 14px;border-radius:10px}
.pick button.on{background:var(--gold);color:#1a1405}
.note{color:var(--dim);font-size:14px;margin-top:16px;line-height:1.5}

/* helper */
#helper{display:none;width:100%;max-width:760px;flex-direction:column;align-items:center}
#prompt{min-height:78px;width:100%;margin-top:12px;background:#0c1117;border:2px solid #2b3843;border-radius:14px;
  padding:10px 16px;font-size:clamp(19px,4.4vw,25px);font-weight:700;line-height:1.35;text-align:center;display:flex;align-items:center;justify-content:center}
#prompt b{color:var(--gold)}
#msg{min-height:28px;margin:8px 0 4px;font-size:18px;font-weight:700;text-align:center}
#msg.bad{color:var(--bad)} #msg.good{color:var(--good)} #msg.hint{color:var(--blue)}
#stepno{color:var(--dim);font-size:14px;margin-top:6px}

#board{position:relative;background:var(--board);border-radius:18px;padding:12px 14px 16px;margin-top:6px;
  box-shadow:inset 0 0 40px rgba(0,0,0,.45)}
#grid{display:grid;grid-template-columns:calc(var(--c)*.6) repeat(4,var(--c));column-gap:0}
.hdr{text-align:center;font-size:13px;color:var(--dim);font-weight:700;padding-bottom:4px}
.cell{height:var(--c);display:flex;align-items:center;justify-content:center;position:relative;
  font-size:calc(var(--c)*.62);font-weight:800;font-family:"Chalkboard SE","Comic Sans MS","Trebuchet MS",sans-serif}
.cell.small{height:calc(var(--c)*.62);font-size:calc(var(--c)*.42)}
.col0{background:var(--colB)} .col1{background:var(--colA)} .col2{background:var(--colB)} .col3{background:var(--colA)}
.sign{justify-content:flex-end;padding-right:6px;color:var(--chalk)}
.rule{grid-column:2 / span 4;height:4px;background:var(--chalk);border-radius:2px;margin:4px 0}
.cell .v{position:relative;z-index:1}
.cell.scr .v{color:var(--blue)}
.cell.carry .v{color:var(--gold)}
.cell.blank::after{content:"";position:absolute;inset:12%;border:3px dashed var(--dim);border-radius:10px}
.cell.cur::after{border-color:var(--gold);border-style:solid;box-shadow:0 0 14px rgba(255,210,63,.55)}
.cell.small.blank::after{inset:8%}
/* this digit will be DRAGGED up as a carry: red box (gold = digit stays put) */
.cell.carryout::after{content:"";position:absolute;inset:12%;border:3px dashed var(--bad);border-radius:10px}
.cell.carryout.cur::after{border-style:solid;box-shadow:0 0 14px rgba(255,77,94,.6)}
.cell.carryout:not(.blank)::after{border-style:solid}
.cell.hl .v{color:var(--gold);text-shadow:0 0 14px rgba(255,210,63,.9)}
.cell.x .v{opacity:.45}
.cell.x::before{content:"";position:absolute;left:22%;right:22%;top:50%;height:4px;background:var(--bad);
  transform:rotate(-35deg);border-radius:2px;z-index:2}
.cell.drag .v{color:var(--gold);animation:pulse .9s ease-in-out infinite;cursor:grab}
@keyframes pulse{50%{transform:scale(1.2)}}
/* drop spot for a carry: red dashed, matching the red box the digit leaves from */
.cell.target::after{content:"";position:absolute;inset:10%;border:3px dashed var(--bad);border-radius:10px;
  animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 18px rgba(255,77,94,.8);background:rgba(255,77,94,.14)}}
.cell.pop .v{animation:pop .45s}
@keyframes pop{40%{transform:scale(1.45)}}
.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.cell.wrong::after{border-color:var(--bad)!important}
#ghost{position:fixed;pointer-events:none;z-index:50;font-size:calc(var(--c)*.7);font-weight:800;color:var(--gold);
  font-family:"Chalkboard SE","Comic Sans MS",sans-serif;transform:translate(-50%,-50%);text-shadow:0 4px 12px #000;display:none}

/* controls */
#controls{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;margin-top:6px}
#side{flex-direction:row!important}
#helper{max-width:900px!important}
#pad{display:grid;grid-template-columns:repeat(3,64px);gap:8px}
#pad button{height:58px;font-size:28px;font-weight:800;border-radius:12px;background:#2b3843;color:var(--chalk);box-shadow:0 4px 0 #111820}
#pad button:active{transform:translateY(3px);box-shadow:0 1px 0 #111820}
#pad button.back{background:#4a2f36}
#pad.off{opacity:.3;pointer-events:none}
#side{display:flex;flex-direction:column;gap:10px}
#hintBtn{background:var(--blue);color:#06121b;font-size:20px;font-weight:800;padding:14px 18px;border-radius:12px;box-shadow:0 4px 0 #1d6f99}
#hintBtn.glow{animation:glowbtn 1.1s ease-in-out infinite}
@keyframes glowbtn{50%{box-shadow:0 4px 0 #1d6f99,0 0 22px rgba(79,195,255,.9)}}
#hintBtn:disabled{opacity:.35}
#backBtn{background:#2b3843;color:var(--chalk);font-size:18px;font-weight:800;padding:12px 16px;border-radius:12px;box-shadow:0 4px 0 #111820}
#backBtn:disabled{opacity:.3}
#quitBtn{background:#2b3843;color:var(--dim);font-size:15px;font-weight:700;padding:10px;border-radius:10px}

/* short screens (phone held sideways) */
@media (max-height:520px){
  :root{--c:36px}
  body{padding:4px 12px 8px}
  #title,#stepno{display:none}
  #top{position:fixed;top:4px;right:10px;width:auto;z-index:5}
  #coins{font-size:15px;padding:3px 10px}
  #prompt{min-height:0;margin-top:0;padding:5px 90px 5px 12px;font-size:16px}
  #msg{min-height:18px;margin:2px 0;font-size:14px}
  #board{padding:4px 10px 6px;margin-top:0}
  .hdr{font-size:10px;padding-bottom:0}
  #play{flex-wrap:nowrap;gap:14px}
  #pad{grid-template-columns:repeat(3,54px);gap:6px}
  #pad button{height:44px;font-size:22px}
  #hintBtn{font-size:15px;padding:9px 12px}
  #quitBtn{font-size:13px;padding:8px}
  #backBtn{font-size:14px;padding:8px 10px}
  #controls{gap:8px}
  .monster{font-size:54px}
  .ask{margin:0 0 8px}
}
/* win */
#win{display:none;text-align:center;margin-top:10px}
#win .big{font-size:clamp(30px,7vw,44px);font-weight:800;color:var(--good)}
</style>
<style>
/* subtraction extras */
#chain{margin-top:10px;font-size:clamp(20px,4.6vw,28px);font-weight:800;color:var(--dim);text-align:center}
#chain .now{color:var(--chalk)}
#chain .done{color:var(--good)}
.cell.chip .v{color:var(--bad);font-size:calc(var(--c)*.36)}
.cell.bor .v{color:var(--gold)}
.cell.lead .v{opacity:.35}
</style>
</head>
<body>
<div id="top">
  <div id="title">⚔️ MATH HELPER · SUBTRACTION</div>
  <div id="coins">🪙 <span id="coinN">100</span></div>
</div>

<!-- START: stands in for "a monster asks you a question" in the dungeon -->
<div id="start">
  <div class="monster">🐙</div>
  <div class="ask" id="askText">265 − 76 − 119 = ?</div>
  <button class="bigbtn gold" id="openBtn">📖 Open Math Helper (🪙<span class="costOpen">10</span>)</button>
  <div class="pick" id="pick">
    <button data-p="265-76-119" class="on">265 − 76 − 119</button>
    <button data-p="342-158">342 − 158</button>
    <button data-p="305-18">305 − 18</button>
    <button data-p="rand">🎲 Random</button>
  </div>
  <div class="note">Test build. In the dungeon, a monster asks the question and this helper opens on top of the fight.<br>
  Opening the helper costs 🪙<span class="costOpen">10</span>, and each hint costs 🪙<span class="costHint">3</span>.</div>
</div>

<!-- HELPER -->
<div id="helper">
  <div id="chain"></div>
  <div id="prompt"></div>
  <div id="stepno"></div>
  <div id="msg"></div>
  <div id="play">
  <div id="board"><div id="grid"></div></div>
  <div id="controls">
    <div id="pad"></div>
    <div id="side">
      <button id="backBtn">◀ Back</button>
      <button id="hintBtn">💡 Hint (🪙<span class="costHint">3</span>)</button>
      <button id="quitBtn">✖ Close helper</button>
    </div>
  </div>
  </div>
  <div id="win">
    <div class="big" id="winText"></div>
    <div class="note" style="font-size:18px;color:var(--chalk)">Now blast that monster! 💥</div>
    <button class="bigbtn" id="againBtn" style="margin-top:14px">Try another</button>
  </div>
</div>
<div id="ghost"></div>

<script>
(function(){
"use strict";

/* ---------- settings ---------- */
const COST_OPEN = 10, COST_HINT = 3;
let coins = 100;   // standalone wallet; the dungeon owns the real one
/* EMBED MODE: the dungeon opens this page as
   subtract-helper.html?embed=1&q=265-76-119&coins=55 and gets
   {type:"spend"|"solved"|"close"} messages back.                   */
const QS = new URLSearchParams(location.search);
const EMBED = QS.get("embed") === "1";
const toGame = msg => { try { window.parent.postMessage(Object.assign({mdHelper:true}, msg), "*"); } catch (e) { /* standalone */ } };
if (EMBED){ const c = parseInt(QS.get("coins"),10); if (isFinite(c) && c >= 0) coins = c; }

/* ---------- grid model ----------
   Columns: 0 = ones, 1 = tens, 2 = hundreds, 3 = thousands.
   Every digit stays in its true column. A column's number can change
   twice (it can lend AND receive, or receive then lend across a zero),
   so there are two borrow rows above the top number. The "10" chip row
   sits on top: that chip is the only thing that ever moves sideways,
   because one ten really does turn into ten ones.                    */
const ROWS = [
  {id:"chip", small:true, cls:"chip"},
  {id:"b2",   small:true, cls:"bor"},
  {id:"b1",   small:true, cls:"bor"},
  {id:"top"},
  {id:"bot", sign:"−"},
  {rule:true},
  {id:"ans"}
];
const NEXTROW = {top:"b1", b1:"b2"};
const COLNAME = ["Ones","Tens","Hundreds","Thousands"];
const COLSHORT = ["O","T","H","Th"];
let NC = 3;

let cells = {};
const K = (r,c) => r + "-" + c;
function cell(r,c){ return cells[K(r,c)] || (cells[K(r,c)] = {v:"", f:new Set()}); }
function setV(r,c,v){ cell(r,c).v = String(v); }
function flag(r,c,f,on){ on===false ? cell(r,c).f.delete(f) : cell(r,c).f.add(f); }
function clearFlags(f){ Object.values(cells).forEach(x => x.f.delete(f)); }

const $ = id => document.getElementById(id);
const grid = $("grid");
let els = {};

function buildGrid(){
  grid.innerHTML = ""; els = {};
  grid.style.gridTemplateColumns = `calc(var(--c)*.6) repeat(${NC},var(--c))`;
  grid.appendChild(div("hdr",""));
  for (let c = NC-1; c >= 0; c--) grid.appendChild(div("hdr col"+c, COLSHORT[c]));
  ROWS.forEach(row => {
    if (row.rule){ grid.appendChild(div("","")); const r = div("rule",""); r.style.gridColumn = `2 / span ${NC}`; grid.appendChild(r); return; }
    grid.appendChild(div("cell sign" + (row.small?" small":""), row.sign || ""));
    for (let c = NC-1; c >= 0; c--){
      const e = div("cell col"+c + (row.small?" small":"") + (row.cls?" "+row.cls:""), "");
      e.dataset.k = K(row.id,c);
      const v = document.createElement("span"); v.className = "v"; e.appendChild(v);
      els[K(row.id,c)] = e;
      grid.appendChild(e);
    }
  });
}
function div(cls, txt){ const d = document.createElement("div"); d.className = cls; d.textContent = txt; return d; }
function render(){
  Object.entries(els).forEach(([k,e]) => {
    const x = cells[k] || {v:"", f:new Set()};
    e.querySelector(".v").textContent = x.v;
    ["blank","cur","hl","x","drag","target","wrong","carryout","lead"].forEach(f => e.classList.toggle(f, x.f.has(f)));
  });
}
function popCell(k){ const e = els[k]; if(!e) return; e.classList.remove("pop"); void e.offsetWidth; e.classList.add("pop"); }

/* ---------- coins ---------- */
function spend(n){
  coins = Math.max(0, coins - n);
  if (EMBED) toGame({type:"spend", n});
  $("coinN").textContent = coins;
  const b = $("coins"); b.classList.remove("spend"); void b.offsetWidth; b.classList.add("spend");
}
document.querySelectorAll(".costOpen").forEach(e => e.textContent = COST_OPEN);
document.querySelectorAll(".costHint").forEach(e => e.textContent = COST_HINT);

const digitsLow = n => String(n).split("").reverse().map(Number);   // 265 -> [5,6,2]
const countUp = (from, n) => Array.from({length:n}, (_,i) => from+i+1).join(", ");

/* ---------- step builder ----------
   nums = [265, 76, 119]. Each subtraction is one PART on a fresh board:
   part 1 = 265 − 76, part 2 = (that answer) − 119.
   Step types: input (type into boxes; a box can hold 2 digits, like 15)
               drag  (move the red "10" chip; tap works too)            */
let PARTS = [];
function buildSteps(nums){
  const steps = [];
  PARTS = [];
  let top = nums[0];
  for (let pi = 1; pi < nums.length; pi++){
    const bot = nums[pi], res = top - bot;
    PARTS.push({top, bot, res});
    addPart(steps, pi-1, top, bot);
    top = res;
  }
  return steps;
}

function addPart(steps, pi, T, B){
  const Td = digitsLow(T), Bd = digitsLow(B), n = Td.length;
  // where each column's CURRENT number lives, and what it is
  const cur = Td.map((v,c) => ({v, r:"top"}));
  const inp  = o => steps.push(Object.assign({type:"input", part:pi}, o));
  const drag = o => steps.push(Object.assign({type:"drag",  part:pi}, o));
  let first = true;
  const start = () => {   // the first step of a part lays out a fresh board
    if (!first) return null;
    first = false;
    return () => {
      cells = {};
      Td.forEach((d,c) => setV("top",c,d));
      Bd.forEach((d,c) => setV("bot",c,d));
    };
  };

  // lend: column k gives away one of its tens/hundreds
  function lend(k, note){
    const from = cur[k], to = NEXTROW[from.r], nv = from.v - 1;
    inp({
      before: start(),
      prompt: note,
      focus: [[from.r,k]],
      boxes: [{r:to, c:k}], answer: [String(nv)],
      hint: `Take one away: ${from.v} − 1 = ${nv}.`,
      after(){ flag(from.r,k,"x"); }
    });
    cur[k] = {v:nv, r:to};
  }
  // receive: column k gets a "10" chip from the column on its left
  function receive(k){
    const from = cur[k], to = NEXTROW[from.r], nv = from.v + 10;
    drag({
      before(){ setV("chip",k+1,"10"); },
      prompt: `That 1 ${COLNAME[k+1].toLowerCase().replace(/s$/,"")} is worth <b>10 ${COLNAME[k].toLowerCase()}</b>! Drag the <b>10</b> over to the ${COLNAME[k]} column.`,
      from: ["chip",k+1], to: [to,k]
    });
    inp({
      before(){ setV(to,k,""); },
      prompt: `The ${COLNAME[k]} now have <b>${from.v} + 10</b>. How many is that?`,
      focus: [[from.r,k]],
      boxes: [{r:to, c:k}], answer: [String(nv)],
      hint: `Start at 10 and count up ${from.v}: ${from.v ? countUp(10, from.v) : "10"}.`,
      after(){ flag(from.r,k,"x"); }
    });
    cur[k] = {v:nv, r:to};
  }

  for (let c = 0; c < n; c++){
    const bd = c < Bd.length ? Bd[c] : null;
    const need = bd === null ? 0 : bd;
    if (cur[c].v < need){
      // find a column that has something to lend (it may be past a zero)
      let L = c + 1; while (cur[L].v === 0) L++;
      lend(L, L === c+1
        ? `<b>${cur[c].v} − ${need}</b>? Not enough ${COLNAME[c].toLowerCase()}! Borrow from the ${COLNAME[L]}: the <b>${cur[L].v}</b> becomes...`
        : `<b>${cur[c].v} − ${need}</b>? Not enough, and the ${COLNAME[c+1]} have <b>0</b>! Go further left: the <b>${cur[L].v}</b> in the ${COLNAME[L]} becomes...`);
      for (let k = L-1; k >= c; k--){
        receive(k);
        if (k > c) lend(k, `Now the ${COLNAME[k]} lend one to the ${COLNAME[k-1]}: the <b>${cur[k].v}</b> becomes...`);
      }
    }
    // subtract this column (skip a leading 0 with nothing under it)
    if (c === n-1 && bd === null && cur[c].v === 0) continue;
    const v = cur[c].v, d = v - need, at = cur[c].r;
    const leadZero = (c === n-1 && d === 0 && n > 1);
    inp({
      before: start(),
      prompt: bd === null
        ? `Nothing to take away in the ${COLNAME[c]}. Bring the <b>${v}</b> down.`
        : `${COLNAME[c]}: <b>${v} − ${bd}</b>`,
      focus: bd === null ? [[at,c]] : [[at,c],["bot",c]],
      boxes: [{r:"ans", c}], answer: [String(d)],
      hint: bd === null ? `Just copy the ${v}.` : `Start at ${bd} and count up to ${v}. How many steps? (${v} − ${bd} = ${d})`,
      after(){ if (leadZero) flag("ans",c,"lead"); }
    });
  }
}

/* ---------- game state ---------- */
let NUMS = [], steps = [], si = 0, typed = "", busy = false, history = [], advT = null, pending = false;
const cloneCells = src => Object.fromEntries(Object.entries(src).map(([k,x]) => [k, {v:x.v, f:new Set(x.f)}]));

function startProblem(nums){
  NUMS = nums.slice(); si = 0; history = []; clearTimeout(advT); busy = false; pending = false;
  NC = Math.max(2, ...nums.map(x => String(x).length));
  buildGrid();
  cells = {};
  steps = buildSteps(nums);
  $("win").style.display = "none";
  $("controls").style.display = "flex";
  enterStep();
}

function showChain(pi){
  const p = PARTS, sym = " − ";
  let html = "";
  if (pi === 0){
    html = `<span class="now">${p[0].top}${sym}${p[0].bot}</span>` + NUMS.slice(2).map(x => sym + x).join("");
  } else if (pi < p.length){
    html = `<span class="done">${p[pi-1].res}</span> <span class="now">${sym.trim()} ${p[pi].bot}</span>` + NUMS.slice(pi+2).map(x => sym + x).join("");
  }
  $("chain").innerHTML = (p.length > 1 ? `Part ${Math.min(pi,p.length-1)+1} of ${p.length}: ` : "") + html;
}

function enterStep(){
  const s = steps[si];
  ["hl","blank","cur","drag","target","wrong","carryout"].forEach(clearFlags);
  if (!s){ finish(); return; }
  if (s.before) s.before();
  history[si] = cloneCells(cells);
  $("backBtn").disabled = si === 0;
  typed = "";
  showChain(s.part);
  $("prompt").innerHTML = `<span>${s.prompt}</span>`;
  $("stepno").textContent = `Step ${si+1} of ${steps.length}`;
  msg("", "");
  (s.focus || []).forEach(([r,c]) => flag(r,c,"hl"));
  const hb = $("hintBtn");
  if (s.type === "input"){
    s.boxes.forEach(o => { setV(o.r,o.c,""); flag(o.r,o.c,"blank"); });
    flag(s.boxes[0].r, s.boxes[0].c, "cur");
    $("pad").classList.remove("off");
    hb.disabled = false;
  } else {
    flag(s.from[0], s.from[1], "drag");
    flag(s.from[0], s.from[1], "carryout");
    flag(s.to[0], s.to[1], "target");
    $("pad").classList.add("off");
    hb.disabled = true;
  }
  render();
}
function msg(t, cls){ const m = $("msg"); m.textContent = t; m.className = cls; }

/* ---------- typing: a box can hold as many digits as its answer ---------- */
function paint(){
  const s = steps[si];
  let pos = 0;
  s.boxes.forEach((o,i) => {
    const len = s.answer[i].length, part = typed.slice(pos, pos+len);
    setV(o.r,o.c,part);
    flag(o.r,o.c,"blank", part.length < len);
    flag(o.r,o.c,"cur", typed.length >= pos && typed.length < pos+len);
    pos += len;
  });
  render();
}
function press(d){
  const s = steps[si];
  if (busy || !s || s.type !== "input") return;
  const total = s.answer.join("").length;
  if (d === "back"){ if (!typed.length) return; typed = typed.slice(0,-1); }
  else { if (typed.length >= total) return; typed += String(d); }
  paint();
  if (typed.length === total) check();
}
function check(){
  const s = steps[si];
  if (typed === s.answer.join("")){
    s.boxes.forEach(o => { flag(o.r,o.c,"blank",false); flag(o.r,o.c,"cur",false); popCell(K(o.r,o.c)); });
    if (s.after) s.after();
    render();
    const nx = steps[si+1];
    const partDone = !nx || nx.part !== s.part;
    const P = PARTS[s.part];
    msg(partDone && PARTS.length > 1 ? `✅ ${P.top} − ${P.bot} = ${P.res}!` : pick(["Nice! ✅","Yes! ✅","You got it! ✅","Boom! ✅"]), "good");
    busy = true; pending = true;
    advT = setTimeout(() => { pending = false; busy = false; si++; enterStep(); }, partDone && nx ? 1500 : 750);
  } else {
    busy = true;
    s.boxes.forEach(o => flag(o.r,o.c,"wrong"));
    render();
    $("board").classList.remove("shake"); void $("board").offsetWidth; $("board").classList.add("shake");
    msg(`Not quite. Try again, or tap 💡 Hint (🪙${COST_HINT}).`, "bad");
    setTimeout(() => { busy = false; typed = ""; s.boxes.forEach(o => flag(o.r,o.c,"wrong",false)); paint(); }, 650);
  }
}
const pick = arr => arr[Math.floor(Math.random()*arr.length)];

$("hintBtn").onclick = () => {
  const s = steps[si];
  if (!s || s.type !== "input") return;
  spend(COST_HINT);
  msg("💡 " + s.hint, "hint");
};

/* ---------- drag the "10" chip (tap also works) ---------- */
const ghost = $("ghost");
let dragging = null;
grid.addEventListener("pointerdown", e => {
  const el = e.target.closest(".cell"); if (!el) return;
  const s = steps[si];
  if (!s || s.type !== "drag" || busy || el.dataset.k !== K(s.from[0], s.from[1])) return;
  e.preventDefault();
  dragging = {x0:e.clientX, y0:e.clientY, moved:false};
  ghost.textContent = cell(s.from[0], s.from[1]).v;
});
window.addEventListener("pointermove", e => {
  if (!dragging) return;
  if (Math.hypot(e.clientX-dragging.x0, e.clientY-dragging.y0) > 8 && !dragging.moved){
    dragging.moved = true; ghost.style.display = "block";
    els[K(...steps[si].from)].querySelector(".v").style.opacity = ".2";
  }
  if (dragging.moved){ ghost.style.left = e.clientX+"px"; ghost.style.top = e.clientY+"px"; }
});
window.addEventListener("pointerup", e => {
  if (!dragging) return;
  const s = steps[si], d = dragging; dragging = null;
  ghost.style.display = "none";
  els[K(...s.from)].querySelector(".v").style.opacity = "";
  if (!d.moved){ commitDrag(); return; }
  const t = els[K(...s.to)].getBoundingClientRect(), pad = 26;
  if (e.clientX > t.left-pad && e.clientX < t.right+pad && e.clientY > t.top-pad && e.clientY < t.bottom+pad) commitDrag();
  else msg("Almost! Drop it in the red box.", "bad");
});
function commitDrag(){
  const s = steps[si];
  if (!s || s.type !== "drag") return;
  setV(s.to[0], s.to[1], "+" + cell(s.from[0], s.from[1]).v);
  setV(s.from[0], s.from[1], "");
  ["drag","carryout"].forEach(f => flag(s.from[0], s.from[1], f, false));
  flag(s.to[0], s.to[1], "target", false);
  render(); popCell(K(...s.to));
  msg("10 more! ✅", "good");
  busy = true; pending = true;
  advT = setTimeout(() => { pending = false; busy = false; si++; enterStep(); }, 650);
}

/* ---------- finish ---------- */
function finish(){
  clearFlags("hl"); render();
  const ans = NUMS.slice(1).reduce((a,b) => a-b, NUMS[0]);
  const q = NUMS.join(" − ");
  $("chain").innerHTML = `<span class="done">${q} = ${ans}</span>`;
  $("prompt").innerHTML = `<span><b>${q} = ${ans}</b></span>`;
  $("stepno").textContent = "All steps done!";
  const lead = PARTS.length && String(PARTS[PARTS.length-1].res).length < NC && cells[K("ans",NC-1)] && cells[K("ans",NC-1)].v === "0";
  msg(lead ? "A 0 at the front does not count, so the answer is " + ans + "." : "", "hint");
  $("controls").style.display = "none";
  $("winText").textContent = `🎉 ${q} = ${ans}`;
  $("win").style.display = "block";
}

/* ---------- Back: rewind to the start of the previous step ---------- */
$("backBtn").onclick = () => {
  clearTimeout(advT); busy = false;
  const target = pending ? si : si - 1;
  pending = false;
  if (target < 0 || !history[target]) return;
  si = target;
  cells = cloneCells(history[si]);
  $("win").style.display = "none";
  $("controls").style.display = "flex";
  // re-enter WITHOUT re-running this step's before() on top of the restored board
  const s = steps[si], b = s.before; s.before = null; enterStep(); s.before = b;
  msg("◀ Here is that step again.", "hint");
};

/* ---------- number pad ---------- */
const pad = $("pad");
[1,2,3,4,5,6,7,8,9].forEach(n => pad.appendChild(padBtn(n, n)));
pad.appendChild(padBtn("⌫", "back", "back"));
pad.appendChild(padBtn(0, 0));
pad.appendChild(document.createElement("span"));
function padBtn(label, val, cls){
  const b = document.createElement("button"); b.textContent = label; if (cls) b.className = cls;
  b.onclick = () => press(val); return b;
}
window.addEventListener("keydown", e => {
  if (/^[0-9]$/.test(e.key)) press(Number(e.key));
  else if (e.key === "Backspace") press("back");
  else if ((e.key === "Enter" || e.key === " ") && steps[si] && steps[si].type === "drag") commitDrag();
});

/* ---------- start screen ---------- */
const parseNums = str => String(str).split("-").map(x => parseInt(x,10));
function validNums(n){
  if (n.length < 2 || n.length > 3 || n.some(x => !isFinite(x) || x < 0 || x > 9999)) return false;
  let t = n[0]; for (let i = 1; i < n.length; i++){ t -= n[i]; if (t < 0) return false; }
  return true;
}
function randChain(){
  const a = 120 + Math.floor(Math.random()*480), b = 11 + Math.floor(Math.random()*(a/3)), c = 11 + Math.floor(Math.random()*((a-b)/2));
  return [a,b,c];
}
let chosen = [265,76,119];
$("pick").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#pick button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  chosen = b.dataset.p === "rand" ? randChain() : parseNums(b.dataset.p);
  $("askText").textContent = chosen.join(" − ") + " = ?";
};
$("openBtn").onclick = () => {
  spend(COST_OPEN);
  $("start").style.display = "none";
  $("helper").style.display = "flex";
  startProblem(chosen);
};
function backToStart(){ $("helper").style.display = "none"; $("start").style.display = "block"; }
$("quitBtn").onclick = () => EMBED ? toGame({type:"close"}) : backToStart();
$("againBtn").onclick = () => EMBED ? toGame({type:"solved", answer: NUMS.slice(1).reduce((a,b)=>a-b, NUMS[0])}) : backToStart();

if (EMBED){
  const n = parseNums(QS.get("q"));
  $("coinN").textContent = coins;
  if (validNums(n)){
    $("start").style.display = "none";
    $("helper").style.display = "flex";
    $("againBtn").textContent = "⚔️ Back to the fight!";
    $("quitBtn").textContent = "✖ Back to the question";
    startProblem(n);
  } else toGame({type:"close"});
}

/* test hook */
window.HELPER = { startProblem, press, commitDrag, get step(){ return steps[si]; }, get steps(){ return steps; }, cells:()=>cells, parts:()=>PARTS, validNums };
})();
</script>
<script src="home-button.js"></script>
</body>
</html>
