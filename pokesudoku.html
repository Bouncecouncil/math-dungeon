<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Poke Sudoku">
<title>Poke Sudoku</title>
<style>
:root{
  --bg:#141a22; --board:#1f2a33; --chalk:#f4f1e8; --dim:#8a97a3;
  --gold:#ffd23f; --good:#3ddc84; --bad:#ff4d5e; --blue:#4fc3ff;
  --cell:56px; --tile:62px; --sprite:38px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;padding:0;height:100%;background:var(--bg);color:var(--chalk);overflow:hidden;
  font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none}
button{font-family:inherit;cursor:pointer;border:none;color:inherit}
img{-webkit-user-drag:none;user-drag:none}

#wrap{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

/* ---------------- HUD (chip style copied from crateroom.html) ---------------- */
#hud{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:8px 12px;width:100%;flex-wrap:wrap;
  background:linear-gradient(180deg,#0c1117,rgba(12,17,23,0));z-index:6;font-weight:800;line-height:1}
.chip{display:flex;align-items:center;gap:6px;background:#0c1117;border:2px solid #2b3843;
  border-radius:999px;padding:6px 12px;font-size:15px;white-space:nowrap}
.chip .lbl{font-size:10px;letter-spacing:1px;color:var(--dim)}
.chip .val{font-size:19px}
#coinChip{border-color:#3a3113}
#coinChip .val{color:var(--gold)}
#coinChip.spend{animation:spend .5s}
@keyframes spend{30%{transform:scale(1.18)}}
#coinChip.earn{animation:earn .6s}
@keyframes earn{30%{transform:scale(1.25)}}
#timeChip .val{color:var(--blue)}
#sizeChip .val{color:var(--chalk)}
#sp{flex:1 1 auto;min-width:0}
.tool{display:flex;align-items:center;justify-content:center;gap:6px;background:#2b3843;color:var(--chalk);
  border-radius:12px;height:38px;padding:0 13px;font-size:15px;font-weight:800;box-shadow:0 4px 0 #111820;white-space:nowrap}
.tool:active{transform:translateY(3px);box-shadow:0 1px 0 #111820}
.tool.blue{background:var(--blue);color:#06121b;box-shadow:0 4px 0 #1d6f99}
.tool:disabled{opacity:.35}
.tool.icon{width:40px;padding:0;font-size:17px}

/* ---------------- stage ---------------- */
#stage{flex:1 1 auto;position:relative;min-height:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:8px;padding:6px}

/* ---------------- board ---------------- */
#board{background:var(--board);border:3px solid #38485a;border-radius:12px;padding:3px;
  box-shadow:0 10px 34px rgba(0,0,0,.6);display:grid;gap:0}
.cell{width:var(--cell);height:var(--cell);display:flex;align-items:center;justify-content:center;
  background:#243039;border:1px solid #33424f;padding:0;position:relative;overflow:hidden}
.cell.bR{border-right:3px solid #7d93a6}
.cell.bB{border-bottom:3px solid #7d93a6}
.cell.given{background:#1a232b}
.cell.peer{background:#2c3a45}
.cell.given.peer{background:#212c35}
.cell.sel{background:#3a4a57}
.cell.sel::after{content:"";position:absolute;inset:2px;border:3px solid var(--gold);border-radius:8px;
  box-shadow:0 0 12px rgba(255,210,63,.55);pointer-events:none}
.cell.clash::before{content:"";position:absolute;inset:3px;border:3px solid rgba(255,77,94,.75);
  border-radius:50%;box-shadow:0 0 10px rgba(255,77,94,.35);pointer-events:none}
.cell.hintpop .pk{animation:pop .5s}
@keyframes pop{40%{transform:scale(1.35)}}
.pk{display:flex;align-items:center;justify-content:center;width:86%;height:86%;pointer-events:none}
.pk img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated;display:block}
.fb{width:86%;height:86%;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:800;color:#10161d;font-size:calc(var(--cell)*.42);line-height:1;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}

/* ---------------- picker ---------------- */
#picker{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-content:center;max-width:100%}
.pk-tile{width:var(--tile);background:#2b3843;border:2px solid #3c4c5a;border-radius:12px;padding:4px 2px 3px;
  display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #111820}
.pk-tile:active{transform:translateY(2px);box-shadow:0 1px 0 #111820}
.pk-tile.on{background:#3d3212;border-color:var(--gold);box-shadow:0 3px 0 #6b5510}
.pk-tile.done{opacity:.4}
.pk-tile .art{width:var(--sprite);height:var(--sprite);display:flex;align-items:center;justify-content:center}
.pk-tile .art img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.pk-tile .art .fb{width:100%;height:100%;font-size:calc(var(--sprite)*.5)}
.pk-tile .nm{font-size:9px;font-weight:800;letter-spacing:0;color:#cfd8e0;line-height:1;
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk-tile.on .nm{color:var(--gold)}
.pk-tile.era{background:#4a2f36;border-color:#6d444e;box-shadow:0 3px 0 #201216}
.pk-tile.era.on{background:#7a3d49;border-color:var(--bad)}
.pk-tile.era .art{font-size:calc(var(--sprite)*.62)}

/* ---------------- hero ---------------- */
#hero{position:absolute;left:8px;bottom:8px;width:66px;height:66px;z-index:4;pointer-events:none;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,.6))}

/* ---------------- toast ---------------- */
#toast{position:absolute;left:50%;top:6px;transform:translateX(-50%);z-index:8;pointer-events:none;
  background:rgba(12,17,23,.92);border:2px solid #2b3843;border-radius:12px;padding:6px 16px;
  font-size:16px;font-weight:800;opacity:0;transition:opacity .2s;max-width:86%;text-align:center}
#toast.show{opacity:1}
#toast.good{border-color:#1d6b3f;color:var(--good)}
#toast.bad{border-color:#5a1b22;color:var(--bad)}
#toast.gold{border-color:#5a4a12;color:var(--gold)}

/* ---------------- overlays ---------------- */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,20,.93);
  display:flex;align-items:center;justify-content:center;padding:12px}
.overlay.hide{display:none}
.panel{width:100%;max-width:620px;max-height:100%;overflow:auto;text-align:center;
  background:var(--board);border:2px solid #2b3843;border-radius:18px;padding:18px 20px;
  box-shadow:0 0 44px rgba(0,0,0,.7)}
.panel h1{margin:0 0 4px;font-size:clamp(24px,6vw,36px);color:var(--gold);letter-spacing:1px}
.panel p{margin:6px 0;font-size:16px;line-height:1.4;color:#cfd8e0}
.panel p.small{font-size:13px;color:var(--dim)}
.rowlbl{font-size:12px;letter-spacing:1.4px;color:var(--dim);font-weight:800;margin:12px 0 5px}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.opts button{background:#2b3843;color:var(--chalk);font-size:16px;font-weight:800;
  min-width:64px;height:46px;padding:0 14px;border-radius:12px;box-shadow:0 4px 0 #111820}
.opts button:active{transform:translateY(3px);box-shadow:0 1px 0 #111820}
.opts button.on{background:var(--gold);color:#1a1405;box-shadow:0 4px 0 #a3830f}
.bigbtn{background:var(--blue);color:#06121b;font-size:21px;font-weight:800;padding:14px 26px;
  border-radius:14px;margin:12px 6px 0;box-shadow:0 5px 0 #1d6f99}
.bigbtn:active{transform:translateY(3px);box-shadow:0 2px 0 #1d6f99}
.bigbtn.gold{background:var(--gold);color:#1a1405;box-shadow:0 5px 0 #a3830f}
.bigbtn.grey{background:#2b3843;color:var(--chalk);box-shadow:0 5px 0 #111820;font-size:17px;padding:12px 20px}
.roster{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.roster .r{display:flex;flex-direction:column;align-items:center;gap:2px;width:58px}
.roster .art{width:34px;height:34px;display:flex;align-items:center;justify-content:center}
.roster .art img{width:100%;height:100%;object-fit:contain;image-rendering:pixelated}
.roster .art .fb{width:100%;height:100%;font-size:17px}
.roster .nm{font-size:10px;font-weight:800;color:var(--dim);white-space:nowrap}
#winStats{font-size:20px;font-weight:800;color:var(--chalk);margin:8px 0 2px}
#winStats b{color:var(--gold)}

/* ---------------- phone held sideways ---------------- */
@media (max-height:430px){
  #hud{padding:4px 8px;gap:5px;flex-wrap:nowrap}
  .chip{padding:3px 9px;font-size:12px;gap:4px}
  .chip .lbl{font-size:8px;letter-spacing:.5px}
  .chip .val{font-size:15px}
  #sizeChip{display:none}
  .tool{height:32px;padding:0 10px;font-size:13px;border-radius:10px;gap:4px}
  .tool.icon{width:34px;padding:0;font-size:15px}
  .tool .txt{display:none}
  #stage{flex-direction:row;gap:6px;padding:3px}
  #picker{flex-wrap:wrap;width:136px;gap:4px}
  .pk-tile{width:64px;padding:3px 2px 2px}
  :root{--tile:64px;--sprite:30px}
  .pk-tile .nm{font-size:9px}
  #hero{width:48px;height:48px;left:4px;bottom:4px}
  /* landscape: the board fills the middle, so the toast sits in the left gutter */
  #toast{font-size:12px;padding:4px 10px;top:3px;left:4px;transform:none;max-width:160px;text-align:left}
  .panel{padding:12px 16px}
  .panel h1{font-size:22px}
  .panel p{font-size:14px;margin:4px 0}
  .rowlbl{margin:7px 0 4px}
  .opts button{height:40px;font-size:15px;min-width:56px}
  .bigbtn{font-size:18px;padding:11px 20px;margin-top:9px}
  .roster{display:none}
}
</style>
</head>
<body>

<div id="wrap">

  <div id="hud">
    <div class="chip" id="coinChip"><span class="lbl">COINS</span><span class="val" id="coinN">55</span></div>
    <div class="chip" id="timeChip"><span class="lbl">TIME</span><span class="val" id="timeN">0:00</span></div>
    <div class="chip" id="sizeChip"><span class="lbl">PUZZLE</span><span class="val" id="sizeN">4x4</span></div>
    <div id="sp"></div>
    <button class="tool blue" id="hintBtn">&#128161; <span class="txt">Hint</span> &#129689;3</button>
    <button class="tool" id="undoBtn">&#8617; <span class="txt">Undo</span></button>
    <button class="tool" id="againBtn">&#10226; <span class="txt">Start over</span></button>
    <button class="tool icon" id="muteBtn">&#128266;</button>
    <button class="tool icon" id="closeBtn">&#10006;</button>
  </div>

  <div id="stage">
    <div id="board"></div>
    <div id="picker"></div>
    <canvas id="hero" width="132" height="132"></canvas>
    <div id="toast"></div>
  </div>

</div>

<!-- START SCREEN -->
<div class="overlay" id="startOv">
  <div class="panel">
    <h1>POKE SUDOKU</h1>
    <p>Fill every row, every column and every box with all of the Pokemon. No Pokemon twice in the same line or box.</p>
    <div class="rowlbl">PUZZLE SIZE</div>
    <div class="opts" id="sizeOpts">
      <button data-size="4" class="on">4 x 4</button>
      <button data-size="6">6 x 6</button>
      <button data-size="9">9 x 9</button>
    </div>
    <div class="rowlbl">HOW HARD</div>
    <div class="opts" id="diffOpts">
      <button data-diff="easy" class="on">Easy</button>
      <button data-diff="medium">Medium</button>
      <button data-diff="hard">Tricky</button>
    </div>
    <div class="roster" id="roster"></div>
    <button class="bigbtn gold" id="playBtn">&#9654; PLAY</button>
    <p class="small">Tap a square, then tap a Pokemon. Tap the same Pokemon again to take it back.</p>
  </div>
</div>

<!-- WIN SCREEN -->
<div class="overlay hide" id="winOv">
  <div class="panel">
    <h1>SOLVED IT!</h1>
    <div id="winStats"></div>
    <p class="small" id="winSub"></p>
    <button class="bigbtn gold" id="nextBtn">&#9654; NEW PUZZLE</button>
    <button class="bigbtn grey" id="menuBtn">Change size</button>
  </div>
</div>

<script>
(function(){
"use strict";

/* =========================================================================
   POKE SUDOKU
   Standalone test room for the 3D dungeon. Sudoku with Pokemon sprites
   instead of digits, in 4x4, 6x6 and 9x9.

   Sprites stream from the public PokeAPI sprite CDN at runtime, so no
   Pokemon artwork is ever committed to this repo. Every sprite carries an
   onerror fallback (a coloured circle with the first letter), so the game
   is fully playable with no network at all.

   Embed contract matches multiply-helper.html:
     pokesudoku.html?embed=1&coins=55&size=9&hero=knight
     postMessage {mdHelper:true, type:"spend"|"solved"|"close"}
   ========================================================================= */

/* ---------------- constants ---------------- */
var COST_HINT = 3;
var REWARD = {4:10, 6:18, 9:30};
var CLUES = {
  4:{easy:10, medium:8,  hard:6},
  6:{easy:22, medium:18, hard:14},
  9:{easy:40, medium:32, hard:26}
};
var DIFF_NAME = {easy:"Easy", medium:"Medium", hard:"Tricky"};
var DIG_BUDGET_MS = 220;     /* hard stop on the dig loop so it can never hang */

var SPRITE_BASE_DEFAULT = "https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/";
var SPRITE_BASE = SPRITE_BASE_DEFAULT;

/* nine popular Pokemon, in the order values 1..9 are handed out */
var POKEMON = [
  {id:25,  name:"Pikachu",    color:"#f7d02c"},
  {id:1,   name:"Bulbasaur",  color:"#5fd68a"},
  {id:4,   name:"Charmander", color:"#ff8a4c"},
  {id:7,   name:"Squirtle",   color:"#6ec6ff"},
  {id:133, name:"Eevee",      color:"#c99a63"},
  {id:52,  name:"Meowth",     color:"#efdca6"},
  {id:39,  name:"Jigglypuff", color:"#ffa8cc"},
  {id:143, name:"Snorlax",    color:"#7f92c4"},
  {id:94,  name:"Gengar",     color:"#a884e0"}
];
var spriteFail = {};   /* pokemon value -> true once its image has failed */

/* ---------------- query string / embed ---------------- */
var QS = new URLSearchParams(location.search);
var EMBED = QS.get("embed") === "1";
function toGame(msg){
  try {
    if (window.parent && window.parent !== window){
      var payload = Object.assign({mdHelper:true}, msg);
      window.parent.postMessage(payload, "*");
    }
  } catch(e){ /* standalone: nobody is listening, and that is fine */ }
}

var HEROES = ["knight","wizard","ninja","robot","explorer","dragon"];
var heroType = (QS.get("hero") || "knight").toLowerCase();
if (HEROES.indexOf(heroType) === -1) heroType = "knight";

var coins = 55;
if (EMBED){
  var qc = parseInt(QS.get("coins"), 10);
  if (isFinite(qc) && qc >= 0) coins = qc;
}

/* ---------------- guarded storage ---------------- */
function lsGet(k, d){ try{ var v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } }
function lsSet(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }

/* ---------------- guarded sound ---------------- */
var Snd = (function(){
  var on = lsGet("poke_snd","1") === "1";
  var cache = {};
  function file(name, vol){
    if (!on) return;
    try{
      var a = cache[name] || (cache[name] = new Audio("sfx/" + name + ".mp3"));
      a.currentTime = 0;
      a.volume = (vol === undefined) ? 0.7 : vol;
      var p = a.play();
      if (p && p.catch) p.catch(function(){});
    }catch(e){ /* audio must never break the game */ }
  }
  return {
    file: file,
    unit: function(){ file("62-toasty"); },
    solved: function(){ file("50-ta-daaa"); },
    clash: function(){
      var opts = ["01-oof","10-bruh","67-ba-dun-dun"];
      file(opts[Math.floor(Math.random()*opts.length)], 0.6);
    },
    isOn: function(){ return on; },
    toggle: function(){ on = !on; lsSet("poke_snd", on ? "1" : "0"); return on; }
  };
})();

/* =========================================================================
   SUDOKU ENGINE
   ========================================================================= */

/* deterministic RNG so a seed reproduces a puzzle exactly */
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function boxDims(N){
  if (N === 4) return {br:2, bc:2};
  if (N === 6) return {br:2, bc:3};
  return {br:3, bc:3};
}
function boxOf(N, r, c){
  var d = boxDims(N);
  return Math.floor(r / d.br) * (N / d.bc) + Math.floor(c / d.bc);
}
/* box membership table, built once per size */
var BOXCACHE = {};
function boxTable(N){
  if (BOXCACHE[N]) return BOXCACHE[N];
  var t = new Int32Array(N*N);
  for (var r = 0; r < N; r++) for (var c = 0; c < N; c++) t[r*N+c] = boxOf(N, r, c);
  BOXCACHE[N] = t;
  return t;
}

/* Count solutions of a grid, stopping as soon as `limit` are found.
   Bitmask candidates plus most-constrained-cell first, which keeps 9x9
   counting in the microsecond-to-millisecond range.                     */
function countSolutions(grid, N, limit){
  var bt = boxTable(N);
  var rows = new Int32Array(N), cols = new Int32Array(N), boxes = new Int32Array(N);
  var g = Int8Array.from(grid);
  var full = (1 << N) - 1;
  var i, v, b;
  for (i = 0; i < N*N; i++){
    v = g[i];
    if (v){
      b = 1 << (v-1);
      var r = (i / N) | 0, c = i % N;
      if ((rows[r] & b) || (cols[c] & b) || (boxes[bt[i]] & b)) return 0;  /* already illegal */
      rows[r] |= b; cols[c] |= b; boxes[bt[i]] |= b;
    }
  }
  var found = 0;
  function rec(){
    var best = -1, bestMask = 0, bestCount = 99, idx, cand, cnt;
    for (idx = 0; idx < N*N; idx++){
      if (g[idx]) continue;
      var rr = (idx / N) | 0, cc = idx % N;
      cand = full & ~(rows[rr] | cols[cc] | boxes[bt[idx]]);
      if (cand === 0) return;                 /* dead end */
      cnt = 0;
      var m = cand;
      while (m){ m &= m - 1; cnt++; }
      if (cnt < bestCount){ bestCount = cnt; best = idx; bestMask = cand; if (cnt === 1) break; }
    }
    if (best === -1){ found++; return; }      /* no empty cell left: a solution */
    var rr2 = (best / N) | 0, cc2 = best % N, bb = bt[best];
    var mask = bestMask;
    while (mask){
      var bit = mask & -mask;
      mask ^= bit;
      var val = 32 - Math.clz32(bit);         /* bit -> 1..N */
      g[best] = val;
      rows[rr2] |= bit; cols[cc2] |= bit; boxes[bb] |= bit;
      rec();
      g[best] = 0;
      rows[rr2] &= ~bit; cols[cc2] &= ~bit; boxes[bb] &= ~bit;
      if (found >= limit) return;
    }
  }
  rec();
  return found;
}

/* A random complete, legal grid. */
function fullGrid(N, rnd){
  var bt = boxTable(N);
  var g = new Int8Array(N*N);
  var rows = new Int32Array(N), cols = new Int32Array(N), boxes = new Int32Array(N);
  var full = (1 << N) - 1;
  function rec(){
    var best = -1, bestMask = 0, bestCount = 99, idx;
    for (idx = 0; idx < N*N; idx++){
      if (g[idx]) continue;
      var rr = (idx / N) | 0, cc = idx % N;
      var cand = full & ~(rows[rr] | cols[cc] | boxes[bt[idx]]);
      if (cand === 0) return false;
      var cnt = 0, m = cand;
      while (m){ m &= m - 1; cnt++; }
      if (cnt < bestCount){ bestCount = cnt; best = idx; bestMask = cand; if (cnt === 1) break; }
    }
    if (best === -1) return true;
    var bits = [];
    var mask = bestMask;
    while (mask){ var bit = mask & -mask; mask ^= bit; bits.push(bit); }
    /* shuffle the candidate order so every seed gives a different grid */
    for (var i = bits.length - 1; i > 0; i--){
      var j = Math.floor(rnd() * (i+1));
      var t = bits[i]; bits[i] = bits[j]; bits[j] = t;
    }
    var rr2 = (best / N) | 0, cc2 = best % N, bb = bt[best];
    for (var k = 0; k < bits.length; k++){
      var b2 = bits[k];
      g[best] = 32 - Math.clz32(b2);
      rows[rr2] |= b2; cols[cc2] |= b2; boxes[bb] |= b2;
      if (rec()) return true;
      g[best] = 0;
      rows[rr2] &= ~b2; cols[cc2] &= ~b2; boxes[bb] &= ~b2;
    }
    return false;
  }
  rec();
  return Array.prototype.slice.call(g);
}

/* Dig clues out of a full grid. A removal is kept ONLY when the counting
   solver proves the puzzle still has exactly one solution, so uniqueness
   holds by construction at every step.                                   */
function makePuzzle(N, diff, seed){
  var t0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
  var now = function(){ return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now(); };
  var rnd = mulberry32(seed >>> 0);
  var sol = fullGrid(N, rnd);
  var puz = sol.slice();
  var target = (CLUES[N] && CLUES[N][diff]) ? CLUES[N][diff] : CLUES[N].easy;
  var order = [];
  for (var i = 0; i < N*N; i++) order.push(i);
  for (var a = order.length - 1; a > 0; a--){
    var b = Math.floor(rnd() * (a+1));
    var t = order[a]; order[a] = order[b]; order[b] = t;
  }
  var filled = N*N;
  for (var k = 0; k < order.length; k++){
    if (filled <= target) break;
    if (now() - t0 > DIG_BUDGET_MS) break;      /* never hang, just leave more clues */
    var idx = order[k];
    var keep = puz[idx];
    puz[idx] = 0;
    if (countSolutions(puz, N, 2) !== 1) puz[idx] = keep;
    else filled--;
  }
  return {
    puzzle: puz, solution: sol, size: N, diff: diff, seed: seed >>> 0,
    clues: filled, ms: now() - t0
  };
}

/* recompute clashes: any filled cell that repeats in its row, column or box */
function computeClash(){
  var N = S.N, G = S.G, bt = boxTable(N);
  var out = {};
  var rows = [], cols = [], boxes = [];
  var i, j;
  for (i = 0; i < N; i++){ rows.push({}); cols.push({}); boxes.push({}); }
  for (i = 0; i < N*N; i++){
    var v = G[i];
    if (!v) continue;
    var r = (i/N)|0, c = i%N, b = bt[i];
    (rows[r][v] = rows[r][v] || []).push(i);
    (cols[c][v] = cols[c][v] || []).push(i);
    (boxes[b][v] = boxes[b][v] || []).push(i);
  }
  function scan(list){
    for (var k in list){
      if (list[k].length > 1){
        for (var m = 0; m < list[k].length; m++) out[list[k][m]] = true;
      }
    }
  }
  for (i = 0; i < N; i++){ scan(rows[i]); scan(cols[i]); scan(boxes[i]); }
  S.clash = out;
}

function peersOf(idx){
  if (idx < 0) return {};
  var N = S.N, bt = boxTable(N), out = {};
  var r = (idx/N)|0, c = idx%N, b = bt[idx];
  for (var i = 0; i < N*N; i++){
    if (((i/N)|0) === r || (i%N) === c || bt[i] === b) out[i] = true;
  }
  return out;
}

function render(){
  computeClash();
  var N = S.N, G = S.G;
  var peers = peersOf(S.sel);
  for (var i = 0; i < N*N; i++){
    var el = cellEls[i], v = G[i];
    if (el.dataset.v !== String(v)){
      el.innerHTML = "";
      if (v) el.appendChild(cellArt(v));
      el.dataset.v = String(v);
    }
    el.classList.toggle("given", !!S.given[i]);
    el.classList.toggle("sel", i === S.sel);
    el.classList.toggle("peer", i !== S.sel && !!peers[i]);
    el.classList.toggle("clash", !!S.clash[i]);
  }
  /* picker: mark the chosen tile, and dim a Pokemon once all of it is placed */
  var counts = {};
  for (var k = 0; k < N*N; k++) if (G[k]) counts[G[k]] = (counts[G[k]]||0) + 1;
  for (var v2 = 1; v2 <= N; v2++){
    tileEls[v2-1].classList.toggle("on", S.selPk === v2);
    tileEls[v2-1].classList.toggle("done", (counts[v2]||0) >= N);
  }
  tileEls[N].classList.toggle("on", S.selPk === 0);
  $("undoBtn").disabled = S.history.length === 0;
}

/* =========================================================================
   LAYOUT (measured, so the grid always fits with no page scrolling)
   ========================================================================= */
function layout(){
  var N = S.N;
  var rect = stageEl.getBoundingClientRect();
  var compact = window.innerHeight <= 430;
  var availW, availH;
  if (compact){
    var pw = pickerEl.offsetWidth || 136;
    availW = rect.width - pw - 24;
    availH = rect.height - 14;
  } else {
    var ph = pickerEl.offsetHeight || 96;
    availW = rect.width - 22;
    availH = rect.height - ph - 28;
  }
  var cell = Math.floor(Math.min(availW / N, availH / N));
  if (!isFinite(cell) || cell <= 0) cell = 40;
  cell = Math.max(30, Math.min(cell, 66));
  document.documentElement.style.setProperty("--cell", cell + "px");
}

/* =========================================================================
   PLAY
   ========================================================================= */
function pushHistory(){
  S.history.push(S.G.slice());
  if (S.history.length > 500) S.history.shift();
}

function onCellTap(e){
  if (S.done) return;
  var i = parseInt(e.currentTarget.dataset.i, 10);
  if (S.given[i]){ S.sel = i; render(); return; }
  /* a Pokemon is already chosen in the picker: drop it straight in */
  if (S.selPk !== null && S.selPk > 0 && S.G[i] === 0){
    S.sel = i;
    doPlace(i, S.selPk);
    return;
  }
  if (S.selPk === 0 && S.G[i] !== 0){        /* eraser armed */
    S.sel = i;
    doPlace(i, 0);
    return;
  }
  S.sel = i;
  render();
}

function onPickTap(v){
  if (S.done) return;
  if (S.sel >= 0 && !S.given[S.sel]){
    if (v === 0){ doPlace(S.sel, 0); S.selPk = 0; render(); return; }
    if (S.G[S.sel] === v){                   /* same Pokemon again: take it back */
      doPlace(S.sel, 0);
      S.selPk = v;
      render();
      return;
    }
    doPlace(S.sel, v);
    S.selPk = v;
    return;
  }
  S.selPk = v;
  render();
}

/* place a value (0 clears). Returns true when the board changed. */
function doPlace(i, v){
  if (S.done) return false;
  if (i < 0 || i >= S.N*S.N) return false;
  if (S.given[i]) return false;
  if (S.G[i] === v) { render(); return false; }
  pushHistory();
  S.G[i] = v;
  if (!S.running && !S.done){ S.running = true; S.started = Date.now(); }
  render();
  if (v){
    if (S.clash[i]){
      Snd.clash();
    } else if (unitDone(i)){
      Snd.unit();
    }
  }
  checkWin();
  return true;
}

/* did this placement complete a full, legal row, column or box? */
function unitDone(i){
  var N = S.N, G = S.G, bt = boxTable(N);
  var r = (i/N)|0, c = i%N, b = bt[i];
  var k, okR = true, okC = true, okB = true;
  var seenR = {}, seenC = {}, seenB = {};
  for (k = 0; k < N; k++){
    var vr = G[r*N + k];
    if (!vr || seenR[vr]) okR = false; else seenR[vr] = 1;
    var vc = G[k*N + c];
    if (!vc || seenC[vc]) okC = false; else seenC[vc] = 1;
  }
  var cnt = 0;
  for (k = 0; k < N*N; k++){
    if (bt[k] !== b) continue;
    cnt++;
    var vb = G[k];
    if (!vb || seenB[vb]) okB = false; else seenB[vb] = 1;
  }
  if (cnt !== N) okB = false;
  return okR || okC || okB;
}

function isSolved(){
  var N = S.N;
  for (var i = 0; i < N*N; i++) if (!S.G[i]) return false;
  computeClash();
  for (var k in S.clash) if (S.clash[k]) return false;
  return true;
}

function checkWin(){
  if (S.done) return false;
  if (!isSolved()) return false;
  S.done = true;
  S.elapsed = seconds();
  S.running = false;
  S.sel = -1;
  render();
  var reward = REWARD[S.N] || 10;
  earn(reward);
  Snd.solved();
  $("winStats").innerHTML = "Time <b>" + fmt(S.elapsed) + "</b> &nbsp; Reward <b>\uD83E\uDE99" + reward + "</b>";
  $("winSub").textContent = S.N + " x " + S.N + " " + DIFF_NAME[S.diff] + ". Coins now " + coins + ".";
  $("winOv").classList.remove("hide");
  if (EMBED) toGame({type:"solved", size:S.N, seconds:S.elapsed});
  return true;
}

function hint(){
  if (S.done) return false;
  var N = S.N, i;
  var empties = [], wrong = [];
  for (i = 0; i < N*N; i++){
    if (S.given[i]) continue;
    if (!S.G[i]) empties.push(i);
    else if (S.G[i] !== S.solution[i]) wrong.push(i);
  }
  var pool = empties.length ? empties : wrong;
  if (!pool.length) return false;
  var idx = pool[Math.floor(Math.random()*pool.length)];
  pushHistory();
  S.G[idx] = S.solution[idx];
  spend(COST_HINT);                       /* spending is never blocked */
  if (!S.running && !S.done){ S.running = true; S.started = Date.now(); }
  S.sel = idx;
  render();
  var el = cellEls[idx];
  el.classList.remove("hintpop"); void el.offsetWidth; el.classList.add("hintpop");
  toast(POKEMON[S.G[idx]-1].name + " goes here!", "gold");
  if (unitDone(idx)) Snd.unit();
  checkWin();
  return true;
}

function undo(){
  if (!S.history.length) return false;
  S.G = S.history.pop();
  S.done = false;
  render();
  return true;
}

function restart(){
  S.G = S.puzzle.slice();
  S.history = [];
  S.sel = -1; S.selPk = -1;
  S.done = false; S.running = false; S.elapsed = 0; S.started = 0;
  $("winOv").classList.add("hide");
  render();
  layout();
  toast("Fresh start!", "", 900);
  return true;
}

/* ---------------- new puzzle ---------------- */
function newPuzzle(size, diff, seed){
  var N = (size === 4 || size === 6 || size === 9) ? size : 4;
  var d = (diff === "easy" || diff === "medium" || diff === "hard") ? diff : "easy";
  var sd = (seed === undefined || seed === null) ? ((Math.random()*4294967295) >>> 0) : (seed >>> 0);
  var made = makePuzzle(N, d, sd);
  S.N = N; S.diff = d; S.seed = made.seed; S.genMs = made.ms;
  S.puzzle = made.puzzle.slice();
  S.solution = made.solution.slice();
  S.G = made.puzzle.slice();
  S.given = made.puzzle.map(function(v){ return v !== 0; });
  S.history = [];
  S.sel = -1; S.selPk = -1;
  S.clash = {};
  S.done = false; S.running = false; S.elapsed = 0; S.started = 0;
  $("sizeN").textContent = N + "x" + N;
  $("winOv").classList.add("hide");
  buildPicker();
  buildBoard();
  render();
  layout();
  return made;
}

var HERO_ART = {
  knight:   {body:"#8f9bb3", trim:"#ffd23f", head:"#d7dce8", accent:"#ff4d5e", plume:true},
  wizard:   {body:"#7a5cc4", trim:"#ffd23f", head:"#f0c9a0", accent:"#4fc3ff", hat:true},
  ninja:    {body:"#2f3945", trim:"#ff4d5e", head:"#2f3945", accent:"#f4f1e8", band:true},
  robot:    {body:"#5d6b78", trim:"#4fc3ff", head:"#8b98a5", accent:"#4fc3ff", antenna:true},
  explorer: {body:"#a8804a", trim:"#6b4a22", head:"#e8b98a", accent:"#3ddc84", brim:true},

};
var heroCv = $("hero"), heroCtx = null;
try { heroCtx = heroCv.getContext("2d"); } catch(e){ heroCtx = null; }

function drawHero(t){
  if (!heroCtx) return;
  var g = heroCtx, W = heroCv.width, H = heroCv.height;
  var a = HERO_ART[heroType] || HERO_ART.knight;
  g.clearRect(0,0,W,H);
  g.save();
  g.scale(W/66, H/66);                       /* draw in a 66 x 66 box */
  var bob = Math.sin(t/260) * 2.2;
  var arm = Math.sin(t/200);
  /* shadow */
  g.fillStyle = "rgba(0,0,0,.35)";
  g.beginPath(); g.ellipse(33, 60, 15, 4, 0, 0, Math.PI*2); g.fill();
  g.translate(0, bob);
  /* wings behind the dragon */
  if (a.wings){
    g.fillStyle = a.trim;
    g.beginPath(); g.moveTo(20,32); g.lineTo(4,22 + arm*3); g.lineTo(9,40); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(46,32); g.lineTo(62,22 - arm*3); g.lineTo(57,40); g.closePath(); g.fill();
  }
  /* legs */
  g.fillStyle = a.trim;
  g.fillRect(24, 48, 7, 10);
  g.fillRect(35, 48, 7, 10);
  /* body */
  g.fillStyle = a.body;
  g.beginPath();
  if (g.roundRect) { g.roundRect(20, 28, 26, 23, 7); } else { g.rect(20, 28, 26, 23); }
  g.fill();
  g.fillStyle = a.accent;
  g.fillRect(29, 33, 8, 4);
  /* arms, up and cheering */
  g.strokeStyle = a.body;
  g.lineWidth = 5; g.lineCap = "round";
  g.beginPath(); g.moveTo(21,32); g.lineTo(12, 20 - arm*4); g.stroke();
  g.beginPath(); g.moveTo(45,32); g.lineTo(54, 20 + arm*4); g.stroke();
  /* head */
  g.fillStyle = a.head;
  g.beginPath(); g.arc(33, 19, 11, 0, Math.PI*2); g.fill();
  /* eyes */
  g.fillStyle = "#10161d";
  g.beginPath(); g.arc(29.5, 18, 1.8, 0, Math.PI*2); g.fill();
  g.beginPath(); g.arc(36.5, 18, 1.8, 0, Math.PI*2); g.fill();
  /* smile */
  g.strokeStyle = "#10161d"; g.lineWidth = 1.6;
  g.beginPath(); g.arc(33, 21, 4, 0.25*Math.PI, 0.75*Math.PI); g.stroke();
  /* per hero topper */
  if (a.plume){
    g.fillStyle = "#c9d2e0"; g.fillRect(22, 10, 22, 4);
    g.fillStyle = a.accent;
    g.beginPath(); g.moveTo(33,10); g.quadraticCurveTo(38,1, 31,3); g.quadraticCurveTo(34,6, 33,10); g.fill();
  }
  if (a.hat){
    g.fillStyle = a.body;
    g.beginPath(); g.moveTo(19,12); g.lineTo(47,12); g.lineTo(33,-4); g.closePath(); g.fill();
    g.fillStyle = a.trim; g.fillRect(19, 10, 28, 4);
  }
  if (a.band){
    g.fillStyle = a.trim; g.fillRect(22, 14, 22, 4);
    g.fillRect(43, 15, 10, 3);
  }
  if (a.antenna){
    g.strokeStyle = a.trim; g.lineWidth = 2;
    g.beginPath(); g.moveTo(33,8); g.lineTo(33,2); g.stroke();
    g.fillStyle = a.accent;
    g.beginPath(); g.arc(33, 1, 3 + Math.abs(arm), 0, Math.PI*2); g.fill();
  }
  if (a.brim){
    g.fillStyle = a.trim;
    g.fillRect(18, 11, 30, 4);
    g.fillStyle = a.body; g.fillRect(24, 4, 18, 8);
  }
  if (a.wings){
    g.fillStyle = a.accent;                  /* little horns */
    g.beginPath(); g.moveTo(26,9); g.lineTo(23,2); g.lineTo(30,7); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(40,9); g.lineTo(43,2); g.lineTo(36,7); g.closePath(); g.fill();
  }
  g.restore();
}

    var v = Number(e.key);
    if (v <= S.N) onPickTap(v);
  } else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0"){
    onPickTap(0);
  } else if (e.key === "h" || e.key === "H"){ hint(); }
  else if (e.key === "u" || e.key === "U"){ undo(); }
});

/* =========================================================================
   BOOT
   ========================================================================= */
paintCoins();
if (EMBED){
  var qs = parseInt(QS.get("size"), 10);
  var size = (qs === 4 || qs === 6 || qs === 9) ? qs : 4;
  var qd = (QS.get("diff") || "easy").toLowerCase();
  $("startOv").classList.add("hide");
  newPuzzle(size, qd);
} else {
  /* the start screen is showing, but build a 4x4 behind it so layout is settled */
  newPuzzle(4, "easy");
}
setTimeout(layout, 60);

/* =========================================================================
   TEST HOOK
   ========================================================================= */
window.POKE = {
  newPuzzle: function(size, diff, seed){ return newPuzzle(size, diff, seed); },
  place: function(r, c, v){ return doPlace(r*S.N + c, v); },
  grid: function(){ return S.G.slice(); },
  solution: function(){ return S.solution.slice(); },
  puzzle: function(){ return S.puzzle.slice(); },
  isSolved: function(){ return isSolved(); },
  hint: hint,
  undo: undo,
  restart: restart,
  get state(){
    return {
      size:S.N, diff:S.diff, seed:S.seed, genMs:S.genMs, clues:S.puzzle.filter(function(v){return v!==0;}).length,
      coins:coins, seconds:seconds(), done:S.done, sel:S.sel, selPk:S.selPk,
      history:S.history.length, embed:EMBED, hero:heroType,
      spriteFail:Object.keys(spriteFail).length, spriteBase:SPRITE_BASE
    };
  },
  /* engine access, used to prove uniqueness in bulk */
  gen: function(size, diff, seed){ return makePuzzle(size, diff, seed >>> 0); },
  countSolutions: function(grid, size, limit){ return countSolutions(grid, size, limit || 2); },
  boxDims: boxDims,
  /* flips the sprite CDN so the offline fallback can be tested for real */
  setSpriteBase: function(base){
    SPRITE_BASE = (base === undefined || base === null) ? SPRITE_BASE_DEFAULT : base;
    spriteFail = {};
    buildPicker();
    for (var i = 0; i < cellEls.length; i++) cellEls[i].dataset.v = "";
    paintRoster();
    render();
    layout();
    return SPRITE_BASE;
  },
  coins: function(){ return coins; },
  setCoins: function(n){ coins = Math.max(0, n|0); paintCoins(); return coins; },
  layout: layout
};

})();
</script>
</body>
</html>
